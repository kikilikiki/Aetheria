# Blueprint Render — portail web Aetheria (site + comptes + candidatures bêta).
# Déploiement : Render → New → Blueprint → sélectionner ce dépôt.
# Voir Docs/Deploiement-Web.md pour le détail (base Neon, permissions du bot Discord, etc.).
#
# Le serveur de jeu TCP N'EST PAS ici : il ne peut pas tourner sur Render (un seul port HTTP,
# pas de TCP, mise en veille après 15 min). Il reste auto-hébergé et pointe vers la même base Neon.

services:
  - type: web
    name: aetheria-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Secrets (à renseigner dans le tableau de bord Render, jamais dans ce fichier) ---
      - key: AETHERIA_DB_CONNECTION      # chaîne Neon (URL postgres:// acceptée telle quelle)
        sync: false
      - key: DISCORD_BOT_TOKEN           # même bot que le serveur de jeu
        sync: false
      - key: DISCORD_BETA_GUILD_ID       # serveur Discord cible (ID)
        sync: false
      - key: AETHERIA_ADMIN_BOOTSTRAP_PASSWORD   # optionnel : amorce le compte admin si la base est vierge
        sync: false

      # --- Valeurs par défaut (surchargables) ---
      - key: DISCORD_BETA_CATEGORY_ID
        value: "1531565847125164123"
      - key: DISCORD_BETA_STAFF_ROLE_IDS
        value: "1531571205805707385,1516429803442671626"
      - key: DISCORD_ROLE_ID_TESTEUR
        value: ""
      - key: DISCORD_INVITE_URL
        value: "https://discord.gg/8NqXPsg7gE"
      - key: GAME_SERVER_HEALTH_URL
        value: ""
